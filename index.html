<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Cross-Ads Autopilot</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; padding: 24px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; }
        h1 { font-size: 20px; font-weight: 700; color: #38bdf8; }
        .badge { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 9999px; }
        .badge-active { background: #064e3b; color: #34d399; }
        .badge-inactive { background: #7f1d1d; color: #f87171; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .stat-label { font-size: 13px; color: #94a3b8; }
        .stat-value { font-size: 18px; font-weight: 700; margin-top: 4px; color: #f1f5f9; }
        .btn { padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 15px; }
        .btn-start { background: #10b981; color: #042f2e; }
        .btn-stop { background: #ef4444; color: #450a0a; }
        .btn-blue { background: #0284c7; color: white; }
        input { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; color: #f8fafc; font-size: 14px; width: 100%; outline: none; }
        .input-group { display: flex; gap: 10px; margin-top: 10px; }
        #log-box { background: #020617; border-radius: 8px; padding: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; height: 300px; overflow-y: auto; color: #a5f3fc; border: 1px solid #0f172a; display: flex; flex-direction: column; gap: 4px; }
        .log-entry { word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Ads Autopilot Dashboard</h1>
                <p style="font-size: 13px; color: #94a3b8; margin-top: 4px;">Kanal: @ratlogscloud | Mesaj: Ads to ads @tgciyim</p>
            </div>
            <span id="authBadge" class="badge badge-inactive">Kontrol Ediliyor...</span>
        </header>

        <div class="grid">
            <div class="card">
                <div class="stat-label">Hedef Sayısı</div>
                <div class="stat-value" id="targetCount">Yükleniyor...</div>
            </div>
            <div class="card">
                <div class="stat-label">Oto Pilot Durumu</div>
                <div class="stat-value" id="pilotStatus">Durduruldu</div>
            </div>
            <div class="card" style="display: flex; align-items: center; justify-content: center;">
                <button id="toggleBtn" class="btn btn-start" onclick="togglePilot()" style="width: 100%;">Başlat</button>
            </div>
        </div>

        <div class="card">
            <div class="stat-label">Gönderilen Reklam Metni (Buradan değiştirebilirsiniz):</div>
            <div class="input-group">
                <input type="text" id="promoInput">
                <button class="btn btn-blue" onclick="updateLink()">Güncelle</button>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span class="stat-label">Canlı Terminal Logları</span>
                <span style="font-size: 12px; color: #64748b;">(2 sn'de bir yenilenir)</span>
            </div>
            <div id="log-box"></div>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                const res = await fetch('/get-data');
                const data = await res.json();
                
                const badge = document.getElementById('authBadge');
                if (data.is_auth) {
                    badge.innerText = "Telegram Aktif";
                    badge.className = "badge badge-active";
                } else {
                    badge.innerText = "Giriş Yapılmamış!";
                    badge.className = "badge badge-inactive";
                }

                document.getElementById('targetCount').innerText = data.target_count + " Kişi";

                const pStatus = document.getElementById('pilotStatus');
                const btn = document.getElementById('toggleBtn');
                if (data.is_auto) {
                    pStatus.innerText = "Çalışıyor (1 Saatlik Döngü)";
                    pStatus.style.color = "#34d399";
                    btn.innerText = "Durdur";
                    btn.className = "btn btn-stop";
                } else {
                    pStatus.innerText = "Durduruldu";
                    pStatus.style.color = "#f87171";
                    btn.innerText = "Başlat";
                    btn.className = "btn btn-start";
                }

                if (!document.getElementById('promoInput').value) {
                    document.getElementById('promoInput').value = data.promo_link;
                }

                const logBox = document.getElementById('log-box');
                logBox.innerHTML = data.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
                logBox.scrollTop = logBox.scrollHeight;
            } catch (e) {
                console.error("Veri çekilemedi", e);
            }
        }

        async function togglePilot() {
            await fetch('/toggle', { method: 'POST' });
            fetchData();
        }

        async function updateLink() {
            const link = document.getElementById('promoInput').value;
            await fetch('/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ link })
            });
            alert("Mesaj güncellendi!");
            fetchData();
        }

        setInterval(fetchData, 2000);
        fetchData();
    </script>
</body>
</html>
